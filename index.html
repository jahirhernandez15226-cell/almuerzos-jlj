<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#111111">
<meta name="description" content="Catálogo digital de Almuerzos Caseros y Más.">
<title>Almuerzos Caseros y Más | Menú</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; background: #111;
    color: #fff; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 18px 12px 24px;
  }
  header { text-align: center; margin-bottom: 12px; }
  h1 { font-size: clamp(20px, 4vw, 30px); margin: 0 0 5px; }
  header p { margin: 0; color: #c8c8c8; font-size: 14px; }
  #libro {
    width: min(96vw, 980px); height: min(70vh, 690px);
    min-height: 300px; margin: 12px auto; position: relative;
  }
  #libro .page { background: #fff; }
  #libro .page img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
  button {
    border: 0; border-radius: 999px; padding: 12px 17px;
    background: #d9b45b; color: #171717; font-size: 15px; font-weight: 700;
    cursor: pointer; touch-action: manipulation;
  }
  button:disabled { opacity: .45; cursor: default; }
  #status { color: #eee; font-size: 14px; min-width: 100px; text-align: center; }
  .hint { text-align: center; color: #aaa; font-size: 12px; margin-top: 12px; max-width: 650px; line-height: 1.5; }
  .error { color: #ffd7a3; text-align: center; padding: 16px; }
  @media (max-width: 600px) {
    body { padding: 14px 8px 20px; }
    #libro { width: 96vw; height: 62vh; min-height: 280px; }
    button { padding: 11px 13px; font-size: 14px; }
  }
</style>
</head>
<body>
<header>
  <h1>Almuerzos Caseros y Más</h1>
  <p>Menú digital · Toca o desliza para pasar las páginas</p>
</header>

<div id="libro" aria-label="Catálogo digital"></div>

<div class="controls">
  <button id="prev" type="button">← Anterior</button>
  <span id="status">Cargando catálogo…</span>
  <button id="next" type="button">Siguiente →</button>
</div>
<p class="hint">También puedes arrastrar una esquina de la página para pasarla. Para que el catálogo funcione, mantén la carpeta <b>paginas</b> junto a este archivo y conserva los nombres originales.</p>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(() => {
  const imagePaths = [
    "paginas/pagina-1.jpg",
    "paginas/pagina-2.jpg",
    "paginas/pagina-3.jpg",
    "paginas/pagina-4.jpg",
    "paginas/pagina-5.jpg",
    "paginas/pagina-6.jpg"
  ];
  const root = document.getElementById("libro");
  const status = document.getElementById("status");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  if (!window.St || !window.St.PageFlip) {
    status.textContent = "No se pudo cargar el visor";
    root.innerHTML = '<p class="error">Revisa tu conexión a Internet y vuelve a abrir la página.</p>';
    return;
  }

  const flip = new St.PageFlip(root, {
    width: 405, height: 720,
    size: "stretch",
    minWidth: 250, maxWidth: 810,
    minHeight: 300, maxHeight: 1440,
    showCover: true,
    usePortrait: true,
    autoSize: true,
    maxShadowOpacity: 0.45,
    flippingTime: 850,
    mobileScrollSupport: true,
    drawShadow: true,
    startPage: 0
  });

  const pages = imagePaths.map((src, i) => {
    const page = document.createElement("div");
    page.className = "page";
    const img = document.createElement("img");
    img.src = src;
    img.alt = "Página " + (i + 1) + " del menú";
    img.loading = i < 2 ? "eager" : "lazy";
    img.onerror = () => {
      status.textContent = "Falta una imagen del catálogo";
      page.innerHTML = '<p class="error">No se encontró ' + src + '. Comprueba que subiste la carpeta paginas completa.</p>';
    };
    page.appendChild(img);
    return page;
  });

  flip.loadFromHTML(pages);
  function update() {
    const current = flip.getCurrentPageIndex() + 1;
    status.textContent = "Página " + current + " de " + flip.getPageCount();
    prev.disabled = current <= 1;
    next.disabled = current >= flip.getPageCount();
  }
  prev.addEventListener("click", () => flip.flipPrev());
  next.addEventListener("click", () => flip.flipNext());
  flip.on("flip", update);
  flip.on("init", update);
  update();
})();
</script>
</body>
</html>
